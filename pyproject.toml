# The shared behaviour of every SCADABLE service.
#
# Distribution is namespaced (scadable-kit) so it cannot collide on an index.
# The import is bare (`from kit.health import Registry`) because it is read far
# more often than it is installed, and it matches how the Go fleet imported the
# same packages.
#
# kit.__version__ is logged at service boot. Across six services that is how you
# answer "who is running a stale kit" without opening six repositories.

[project]
name = "scadable-kit"
version = "0.1.0"
description = "Cross-cutting behaviour shared by every SCADABLE service"
requires-python = ">=3.12,<3.13"

# Deliberately thin. Every dependency added here is a dependency every service
# in the fleet inherits and cannot refuse.
dependencies = [
    # "fastapi",
    # "pydantic-settings",
    # "opentelemetry-sdk",
    # "opentelemetry-exporter-otlp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
