# The gate. This package is a dependency of every service, so a defect here
# reaches all of them at once and there is no per-service place to catch it.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras --dev

      - name: Lockfile is in sync
        run: uv lock --check

      - name: Lint
        run: uv run ruff format --check . && uv run ruff check .

      - name: Types
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q

      # Installed without the telemetry extra, because that is how a service
      # that exports nothing will install it, and the kit has to keep working.
      - name: Install without the optional extra
        run: |
          uv venv --python 3.14 .venv-minimal
          VIRTUAL_ENV=.venv-minimal uv pip install .
          VIRTUAL_ENV=.venv-minimal uv run --no-project python -c "
          import kit, kit.health, kit.httpapi, kit.config, kit.observability, kit.email
          print('kit', kit.__version__, 'imports without the otel extra')
          "

  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes in prose
        run: |
          if grep -rn $'—' --include="*.md" .; then
            echo "Em dashes are not used in SCADABLE copy."
            exit 1
          fi
